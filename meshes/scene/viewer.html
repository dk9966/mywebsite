<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>island world — viewer</title>
<style>
  html,body{margin:0;height:100%;background:#04060c;color:#9fb0c4;
            font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;overflow:hidden}
  #hud{position:fixed;left:12px;top:12px;z-index:10;pointer-events:none;
       text-shadow:0 1px 3px #000}
  #hud b{color:#e6f0ff}
  #err{position:fixed;inset:0;display:none;place-items:center;padding:40px;
       background:#0b0d10;color:#ff9b9b;white-space:pre-wrap;z-index:20}
  label{pointer-events:auto;display:block;margin-top:6px;color:#7f93a8}
  /* vignette: cheaper than a shader pass and identical on a static camera */
  #vig{position:fixed;inset:0;pointer-events:none;z-index:5;
       background:radial-gradient(ellipse at 50% 42%,
                  transparent 55%, rgba(2,4,10,.55) 100%)}
</style>
</head>
<body>
<div id="hud">
  <b>island world</b><br>
  drag to orbit · scroll to zoom · right-drag to pan
  <div id="stats"></div>
  <label><input type="checkbox" id="bloom" checked> bloom</label>
  <label><input type="checkbox" id="atmo" checked> atmosphere</label>
  <label><input type="checkbox" id="spin"> auto-spin</label>
</div>
<div id="vig"></div>
<div id="err"></div>

<script type="importmap">
{"imports":{
  "three":"https://unpkg.com/three@0.183.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.183.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const err = (m) => { const e = document.getElementById('err');
  e.style.display = 'grid'; e.textContent = m; };

if (location.protocol === 'file:') {
  err('This page has to be served over http, not opened as a file.\n\n' +
      'A browser refuses to fetch the .glb and .json files from file:// for\n' +
      'security reasons. From the repo root run:\n\n' +
      '    python3 -m http.server 8080\n\n' +
      'then open  http://localhost:8080/meshes/scene/viewer.html');
  throw new Error('file protocol');
}

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();

// ------------------------------------------------------------- atmosphere
// The concept art is a cave: near-black rock overhead, and a blue glow
// WELLING UP FROM BELOW the islands -- the pillars read as silhouettes with
// lit undersides. Everything here follows from that one inversion: the
// brightest light source in the scene is the abyss, not a sky.

// Cave dome: a big inverted sphere carrying the whole background gradient.
// Cheap 2-octave value noise mottles the upper half so it reads as rock
// rather than a studio backdrop; the lower half runs to a bright core so
// the horizon under the islands glows the way the reference's pit does.
const caveShader = {
  uniforms: {},
  vertexShader: /* glsl */`
    varying vec3 vDir;
    void main() {
      vDir = normalize(position);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }`,
  fragmentShader: /* glsl */`
    varying vec3 vDir;
    float hash(vec3 p) {
      return fract(sin(dot(p, vec3(127.1, 311.7, 74.7))) * 43758.5453);
    }
    float vnoise(vec3 p) {
      vec3 i = floor(p), f = fract(p);
      f = f * f * (3.0 - 2.0 * f);
      float a = mix(hash(i), hash(i + vec3(1,0,0)), f.x);
      float b = mix(hash(i + vec3(0,1,0)), hash(i + vec3(1,1,0)), f.x);
      float c = mix(hash(i + vec3(0,0,1)), hash(i + vec3(1,0,1)), f.x);
      float d = mix(hash(i + vec3(0,1,1)), hash(i + vec3(1,1,1)), f.x);
      return mix(mix(a, b, f.y), mix(c, d, f.y), f.z);
    }
    void main() {
      float h = vDir.y;                       // +1 straight up, -1 straight down
      vec3 top  = vec3(0.003, 0.004, 0.009);  // rock overhead
      vec3 mid  = vec3(0.010, 0.020, 0.045);  // horizon
      vec3 deep = vec3(0.035, 0.090, 0.220);  // upper abyss
      vec3 core = vec3(0.120, 0.320, 0.820);  // the pit itself

      vec3 col = mix(mid, top, smoothstep(0.0, 0.35, h));
      float t = max(-h, 0.0);
      col = mix(col, deep, smoothstep(0.04, 0.45, t));
      col += core * pow(smoothstep(0.25, 1.0, t), 2.2);

      // rock mottling above the horizon; the abyss glow stays clean.
      // Two scales: broad patches shape dark masses, fine grain breaks the
      // smoothness -- without the hard mix the top half reads as a clear
      // evening sky rather than a cave ceiling.
      // stretched vertically so the walls streak like flowstone
      vec3 q = vDir * vec3(4.0, 1.4, 4.0);
      float n = vnoise(q * 1.0) * 0.6 + vnoise(q * 3.2) * 0.4;
      float rock = smoothstep(-0.30, 0.12, h);
      col *= mix(1.0, 0.18 + 1.15 * n * n, rock);

      // The pit is not a clean gradient in the concept: dark far-wall rock
      // hangs between the horizon and the depths, and the glow shows through
      // in patches between those shapes. A noise mask carves that ring; the
      // very bottom stays clean so the pit core still reads as pure light.
      float ang = atan(vDir.z, vDir.x);
      float wallBand = smoothstep(0.02, 0.22, t) * smoothstep(0.62, 0.30, t);
      float w = vnoise(vec3(ang * 2.6, vDir.y * 3.2, 2.7)) * 0.6
              + vnoise(vec3(ang * 7.0, vDir.y * 8.0, 9.1)) * 0.4;
      col *= mix(1.0, 0.25 + 1.3 * smoothstep(0.30, 0.72, w), wallBand);

      // faint vertical streaks below -- light shafts in the haze
      float streak = 0.5 + 0.5 * sin(ang * 34.0 + vnoise(vDir * 3.0) * 6.0);
      col += core * 0.10 * streak * pow(t, 1.5);

      gl_FragColor = vec4(col, 1.0);
    }`,
};
const domeMat = new THREE.ShaderMaterial({
  ...caveShader, side: THREE.BackSide, depthWrite: false, fog: false });

// Reflections come from the same dome, so the semi-gloss stone picks up the
// blue from below exactly where the background shows it. (The env copy has
// its own fixed radius: PMREM's cube camera only sees out to ~100 units.)
const pmrem = new THREE.PMREMGenerator(renderer);
{
  const envScene = new THREE.Scene();
  envScene.add(new THREE.Mesh(new THREE.SphereGeometry(50, 48, 32), domeMat));
  scene.environment = pmrem.fromScene(envScene, 0.06).texture;
}

// Lit from underneath: the hemisphere's GROUND is the bright side.
scene.add(new THREE.HemisphereLight(0x0e1626, 0x2f6fe0, 0.55));
const key = new THREE.DirectionalLight(0x9fc2ff, 0.4);   // faint cool key for form
key.position.set(30, 50, 20); scene.add(key);
const under = new THREE.DirectionalLight(0x2e7bff, 0.55);  // abyss uplight
under.position.set(-8, -40, -6); scene.add(under);

const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 2000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(
  new THREE.Vector2(innerWidth, innerHeight), 0.8, 0.55, 0.8);
composer.addPass(bloom);
composer.addPass(new OutputPass());

const loader = new GLTFLoader();
const load = (url) => new Promise((res, rej) => loader.load(url, res, undefined, rej));

const data = await fetch('instances.json').then(r => {
  if (!r.ok) throw new Error('instances.json: ' + r.status); return r.json();
}).catch(e => { err('Could not load instances.json\n\n' + e.message); throw e; });

// one fetch per unique model, however many times it is placed
const models = {};
await Promise.all(Object.entries(data.models).map(async ([name, url]) => {
  try { models[name] = (await load(url)).scene; }
  catch (e) { console.warn('missing', name, url); }
}));

const world = new THREE.Group();
let meshes = 0, tris = 0;
for (const inst of data.instances) {
  const src = models[inst.model];
  if (!src) continue;
  const obj = src.clone(true);
  if (inst.node) {                       // pick one part out of a kit file
    const part = obj.getObjectByName(inst.node);
    if (!part) continue;
    part.position.set(0, 0, 0);
    obj.clear(); obj.add(part);
  }
  obj.position.fromArray(inst.position);
  obj.rotation.y = inst.rotation_y || 0;
  if (inst.scale) obj.scale.fromArray(inst.scale);
  obj.traverse(o => { if (o.isMesh) { meshes++;
    tris += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3; } });
  world.add(obj);
}
scene.add(world);

// Materials are shared between clones, so collect them once -- a per-mesh
// multiply would compound 122 times over.
{
  const mats = new Set();
  world.traverse(o => { if (o.isMesh && o.material) mats.add(o.material); });
  for (const m of mats) {
    m.envMapIntensity = 0.55;
    // At the asset's emissive strength ACES clips the glow cracks to white;
    // dimmer emissive + bloom keeps the brightness, and biasing the factor
    // toward blue keeps the hue -- the LUT's hot core is nearly white, so
    // without this every line whites out at its centre.
    if (m.emissiveIntensity !== undefined) m.emissiveIntensity *= 0.5;
    if (m.emissive) m.emissive.setRGB(0.45, 0.70, 1.0);
  }
}

// frame it
const box = new THREE.Box3().setFromObject(world);
const size = box.getSize(new THREE.Vector3());
const mid = box.getCenter(new THREE.Vector3());
const span = size.length();
controls.target.copy(mid);
camera.position.set(mid.x + size.x * 0.8, mid.y + size.y * 1.1, mid.z + size.z * 0.9);
camera.far = Math.max(span * 8, span * 3 + 400); camera.updateProjectionMatrix();

// ---------------------------------------------------- size-dependent pieces
const atmo = new THREE.Group();
scene.add(atmo);

// the dome itself, sized to comfortably contain any orbit
const dome = new THREE.Mesh(
  new THREE.SphereGeometry(Math.max(span * 2.5, 80), 64, 40), domeMat);
dome.position.set(mid.x, mid.y, mid.z);
atmo.add(dome);

// Depth haze. Exponential, so the far islands sink into blue and the cave
// walls never read as a hard backdrop. The colour sits between the dome's
// horizon and abyss tones -- fog this dark must NOT be grey or everything
// silvers over.
const fog = new THREE.FogExp2(0x061224, 0.7 / span);

// The glowing pit: two stacked additive discs far below the decks. They are
// what actually blooms; the dome gradient alone is too dim to bleed.
const glowTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  grad.addColorStop(0.0, 'rgba(255,255,255,1)');
  grad.addColorStop(0.45, 'rgba(255,255,255,0.45)');
  grad.addColorStop(1.0, 'rgba(255,255,255,0)');
  g.fillStyle = grad; g.fillRect(0, 0, 256, 256);
  return new THREE.CanvasTexture(c);
})();
const glowDisc = (color, radius, y, opacity) => {
  const m = new THREE.Mesh(
    new THREE.PlaneGeometry(radius * 2, radius * 2),
    new THREE.MeshBasicMaterial({ map: glowTex, color, transparent: true,
      opacity, blending: THREE.AdditiveBlending, depthWrite: false, fog: false }));
  m.rotation.x = -Math.PI / 2;
  m.position.set(mid.x, y, mid.z);
  return m;
};
atmo.add(glowDisc(0x1e4fa8, span * 0.95, box.min.y - size.y * 0.85, 0.4));
atmo.add(glowDisc(0x3f7fe0, span * 0.45, box.min.y - size.y * 0.80, 0.3));

// Motes: slow blue specks drifting up out of the pit, like the flecks in the
// concept render. Additive points, wrapped vertically.
const motes = (() => {
  const n = 900;
  const p = new Float32Array(n * 3);
  const lo = box.min.y - size.y * 0.6, hi = box.max.y + size.y * 0.5;
  for (let i = 0; i < n; i++) {
    p[i * 3]     = mid.x + (Math.random() - 0.5) * size.x * 1.7;
    p[i * 3 + 1] = lo + Math.random() * (hi - lo);
    p[i * 3 + 2] = mid.z + (Math.random() - 0.5) * size.z * 1.7;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(p, 3));
  const mat = new THREE.PointsMaterial({ color: 0x7fb4ff, size: span * 0.0018,
    transparent: true, opacity: 0.35, blending: THREE.AdditiveBlending,
    depthWrite: false, sizeAttenuation: true });
  const pts = new THREE.Points(geo, mat);
  pts.userData = { lo, hi, speed: size.y * 0.02 };
  return pts;
})();
atmo.add(motes);

document.getElementById('stats').textContent =
  `${data.instances.length} instances · ${Object.keys(models).length} files · ` +
  `${meshes} meshes · ${Math.round(tris / 1000)}k tris`;

const cb = document.getElementById('bloom');
const at = document.getElementById('atmo');
const sp = document.getElementById('spin');
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.1);
  if (sp.checked) world.rotation.y += 0.0015;
  const on = at.checked;
  atmo.visible = on;
  scene.fog = on ? fog : null;
  document.getElementById('vig').style.display = on ? 'block' : 'none';
  const mp = motes.geometry.attributes.position;
  const { lo, hi, speed } = motes.userData;
  for (let i = 0; i < mp.count; i++) {
    let y = mp.getY(i) + speed * dt * (0.5 + (i % 7) / 7);
    if (y > hi) y = lo;
    mp.setY(i, y);
  }
  mp.needsUpdate = true;
  controls.update();
  bloom.enabled = cb.checked;
  composer.render();
});
</script>
</body>
</html>
