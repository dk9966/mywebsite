<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clip Reference</title>
    <style>
      :root {
        color-scheme: dark;
      }

      body {
        margin: 0;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0d0f12;
        color: #f2f5f7;
      }

      .clips-page {
        max-width: 1800px;
        margin: 0 auto;
        padding: 32px 20px 56px;
      }

      .clips-page__header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 12px 24px;
        margin-bottom: 28px;
      }

      .clips-page__header-text {
        flex: 1 1 320px;
      }

      .clips-page__title {
        margin: 0 0 8px;
        font-size: 30px;
        line-height: 1.15;
      }

      .clips-page__subtitle {
        margin: 0;
        color: #b5bdc7;
      }

      .column-switcher {
        display: flex;
        gap: 4px;
        flex-shrink: 0;
      }

      .column-switcher__btn {
        width: 34px;
        height: 34px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid #262d35;
        border-radius: 8px;
        background: #151a1f;
        color: #8892a0;
        font: inherit;
        font-size: 14px;
        cursor: pointer;
        transition: background 0.15s, color 0.15s, border-color 0.15s;
      }

      .column-switcher__btn:hover {
        background: #1c2229;
        color: #c8cdd4;
      }

      .column-switcher__btn--active {
        background: #f2f5f7;
        color: #0d0f12;
        border-color: #f2f5f7;
      }

      .column-switcher__btn--active:hover {
        background: #dde1e6;
        color: #0d0f12;
      }

      .clips-grid {
        display: grid;
        grid-template-columns: repeat(var(--cols, 1), 1fr);
        gap: 20px;
      }

      .clip-card {
        background: #151a1f;
        border: 1px solid #262d35;
        border-radius: 14px;
        padding: 8px;
      }

      .clip-card__video {
        width: 100%;
        display: block;
        border-radius: 10px;
        background: #000;
      }

      .clip-card__title {
        margin: 8px 0 4px;
        font-size: 18px;
      }

      .clip-card__description {
        margin: 0;
        color: #b5bdc7;
        line-height: 1.5;
      }

      .clips-grid[data-cols="4"] .clip-card__title,
      .clips-grid[data-cols="5"] .clip-card__title,
      .clips-grid[data-cols="6"] .clip-card__title {
        font-size: 14px;
        margin-top: 10px;
      }

      .clips-grid[data-cols="4"] .clip-card__description,
      .clips-grid[data-cols="5"] .clip-card__description,
      .clips-grid[data-cols="6"] .clip-card__description {
        font-size: 13px;
      }

      .clips-grid[data-cols="5"] .clip-card,
      .clips-grid[data-cols="6"] .clip-card {
        padding: 6px;
        border-radius: 10px;
      }

      .clips-grid[data-cols="5"] .clip-card__video,
      .clips-grid[data-cols="6"] .clip-card__video {
        border-radius: 7px;
      }

    </style>
  </head>
  <body>
    <main class="clips-page">
      <div class="clips-page__header">
        <div class="clips-page__header-text">
          <h1 class="clips-page__title">Screen Recording Clips</h1>
          <p class="clips-page__subtitle">
            Local reference page for all clips in `plans/clips`. Visible clips autoplay muted; scroll to
            pause/resume. All clips are scrubbable.
          </p>
        </div>
        <div class="column-switcher" id="column-switcher" role="radiogroup" aria-label="Grid columns">
          <button class="column-switcher__btn" data-cols="1" role="radio" aria-checked="false">1</button>
          <button class="column-switcher__btn" data-cols="2" role="radio" aria-checked="false">2</button>
          <button class="column-switcher__btn" data-cols="3" role="radio" aria-checked="false">3</button>
          <button class="column-switcher__btn" data-cols="4" role="radio" aria-checked="false">4</button>
          <button class="column-switcher__btn" data-cols="5" role="radio" aria-checked="false">5</button>
          <button class="column-switcher__btn" data-cols="6" role="radio" aria-checked="false">6</button>
        </div>
      </div>

      <section class="clips-grid" id="clips-grid" aria-label="Clip list"></section>
    </main>

    <script>
      const clipsDataNode = document.getElementById("clips-data");
      const clips = JSON.parse(clipsDataNode?.textContent ?? "[]");

      const clipsGrid = document.getElementById("clips-grid");

      const observer = new IntersectionObserver(
        (entries) => {
          entries.forEach((entry) => {
            const video = entry.target.querySelector("video");
            if (!video) return;

            if (entry.isIntersecting) {
              video.play().catch(() => {});
            } else {
              video.pause();
            }
          });
        },
        { threshold: 0.25 },
      );

      function createClipCard(clip) {
        const article = document.createElement("article");
        article.className = "clip-card";

        const video = document.createElement("video");
        video.className = "clip-card__video";
        video.controls = true;
        video.preload = "none";
        video.muted = true;
        video.defaultMuted = true;
        video.playsInline = true;
        video.setAttribute("playsinline", "");
        video.src = new URL(`./clips/${clip.fileName}`, window.location.href).href;

        const title = document.createElement("h2");
        title.className = "clip-card__title";
        title.textContent = clip.title;

        const description = document.createElement("p");
        description.className = "clip-card__description";
        description.textContent = clip.description;

        article.append(video, title, description);
        clipsGrid.append(article);
        observer.observe(article);
      }

      clips.forEach(createClipCard);

      const STORAGE_KEY = "clips-ref-cols";
      const switcher = document.getElementById("column-switcher");
      const buttons = switcher.querySelectorAll(".column-switcher__btn");

      function setColumns(count) {
        clipsGrid.style.setProperty("--cols", count);
        clipsGrid.setAttribute("data-cols", count);
        buttons.forEach((btn) => {
          const active = btn.dataset.cols === String(count);
          btn.classList.toggle("column-switcher__btn--active", active);
          btn.setAttribute("aria-checked", active);
        });
        try { localStorage.setItem(STORAGE_KEY, count); } catch {}
      }

      switcher.addEventListener("click", (e) => {
        const btn = e.target.closest("[data-cols]");
        if (btn) setColumns(Number(btn.dataset.cols));
      });

      const saved = Number(localStorage.getItem(STORAGE_KEY)) || 2;
      setColumns(Math.min(6, Math.max(1, saved)));
    </script>
