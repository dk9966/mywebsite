<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Centerline extractor — debug</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #0a0a0a;
        color: #e0e0e0;
        font-family: ui-monospace, "JetBrains Mono", monospace;
        font-size: 12px;
        padding: 32px 40px 120px;
      }
      header {
        position: sticky;
        top: 0;
        background: linear-gradient(#0a0a0a 75%, transparent);
        padding: 12px 0 20px;
        margin-bottom: 16px;
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 24px;
        border-bottom: 1px solid #1a1a1a;
      }
      h1 {
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #888;
      }
      .font-switch {
        display: flex;
        gap: 4px;
      }
      .font-switch button {
        background: transparent;
        color: #777;
        border: 1px solid #2a2a2a;
        font-family: inherit;
        font-size: 11px;
        padding: 6px 12px;
        cursor: pointer;
        letter-spacing: 0.04em;
      }
      .font-switch button.active {
        background: #00dffc;
        color: #000;
        border-color: #00dffc;
      }
      .legend {
        margin-left: auto;
        color: #555;
        font-size: 11px;
      }
      .grid {
        display: grid;
        grid-template-columns: 32px repeat(7, 120px);
        gap: 8px;
        align-items: center;
      }
      .grid-header {
        display: contents;
      }
      .grid-header > div {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #555;
        padding-bottom: 8px;
        border-bottom: 1px solid #1a1a1a;
        margin-bottom: 8px;
      }
      .row {
        display: contents;
      }
      .row > * {
        height: 120px;
      }
      .char {
        font-size: 14px;
        color: #888;
        text-align: right;
        padding-right: 8px;
        height: auto;
      }
      .cell {
        background: #111;
        border: 1px solid #1a1a1a;
        position: relative;
        overflow: hidden;
      }
      .cell svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      .meta {
        background: transparent;
        border: none;
        font-size: 10px;
        color: #666;
        line-height: 1.5;
        padding: 8px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .meta b {
        color: #aaa;
        font-weight: 500;
      }
      .meta .warn {
        color: #f5a623;
      }
      .meta .err {
        color: #ff4d4d;
      }
      .section-label {
        grid-column: 1 / -1;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: #444;
        padding: 24px 0 4px;
        border-bottom: 1px solid #1a1a1a;
      }
      .status {
        color: #666;
        padding: 24px 0;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Centerline extractor — debug</h1>
      <div class="font-switch" id="font-switch"></div>
      <div class="legend">
        rasterRes 512 · simplifyEps 0.01em · minStrokeLen 0.03em · rendered = DrainText hold (masked fill, 120px)
      </div>
    </header>
    <div id="status" class="status">Loading fonts…</div>
    <div id="root"></div>
    <script type="module" src="./centerline-debug.ts"></script>
  </body>
</html>
